<h2>Verzekeraars</h2>
@for (insurer of insurers; track $index) {
<div class="insurer-item">
    <a (click)="goToDetail(insurer.id)">
        <img class="insurer-image" [src]="'/insurances/companies/' + insurer.imageUrl" alt="{{ insurer.name }}" />
        <h3>{{ insurer.name }}</h3>
    </a>
</div>
}
