<div class="dkv-offers-page">
  @if (offers) {
    <div style="max-width: 800px; margin: 0 auto;">
        <div class="card">
          <p-galleria [value]="offers" [autoPlay]="true" [transitionInterval]="4000" [circular]="true" [responsiveOptions]="galleriaResponsiveOptions" [style]="galleriaStyle" [containerStyle]="galleriaContainerStyle" [numVisible]="6" [circular]="true">
            <ng-template #item let-item>
              <img [src]="item.itemImageSrc" style="width: 100%; display: block" (click)="dialogVisible = true " />
              <p-dialog [(visible)]="dialogVisible" [modal]="true" [closable]="false" header="{{ item.title }}" [breakpoints]="{'960px': '75vw', '640px': '100vw'}" [style]="{ width: '30rem' }">
                <div class="w-full text-center mb-4">
                  <span class="w-4rem h-4rem border-circle inline-flex justify-content-center align-items-center bg-blue-100">
                    <img [src]="item.thumbnailImageSrc" style="display: block" />
                  </span>
                </div>
                @if (item.youTubeVideo) {
                  <div class="w-full text-center mb-4">
                    <iframe width="448" height="252" [src]="safeUrl" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="display: inline-block"></iframe>
                  </div>
                }
                <div class="w-full text-center border p-3 border-round surface-border mb-2">
                  <button pButton pRipple class="mt-2" (click)="navigateUrl(item.url,item.offerIsInternal)" icon="pi pi-link" label="{{ 'INSURE.ToInsurersOffer' | translate }}"></button>
                </div>
                <ng-template pTemplate="footer">
                  <div class="w-full text-center">
                    <button outlined="true" pButton pRipple icon="pi pi-times" text (click)="dialogVisible = false" label="Cancel"></button>
                  </div>
                </ng-template>
              </p-dialog>
            </ng-template>
            <ng-template #thumbnail let-item>
              <div class="grid nogutter justify-center">
                <img [src]="item.thumbnailImageSrc" style="display: block" />
              </div>
            </ng-template>
          </p-galleria>
        </div>
    </div>
  } @else {
    <div style="max-width: 800px; margin: 0 auto;">
        <div class="card">
          <p class="text-center">
            <i class="pi pi-spin pi-cog" style="font-size: 5rem"></i>
          </p>
        </div>
    </div>
  }
</div>
