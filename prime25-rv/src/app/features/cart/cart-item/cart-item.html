<div class="rounded-lg border border-gray-200 bg-white p-4 shadow-sm mb-4">
    <a routerLink="/features/shop/{{item().productId}}" class="font-bold hover:underline"> {{item().productName}} </a>

    <div class="flex items-center justify-between gap-6">
        <div class="flex items-center justify-between order-3">
            <div class="flex items-center align-middle gap-3">
                <p-button outlined="true" severity="secondary" (click)="decrementQuantity()" icon="pi pi-minus" [disabled]="item().quantity <= 0" />

                <div class="font-semibold text-xl mb-1">{{item().quantity}}</div>

                <p-button outlined="true" severity="secondary" (click)="incrementQuantity()" icon="pi pi-plus" class="" />
            </div>

            <div class="text-end order-4 w-32">
                <p class="ml-2 font-bold text">{{item().price | currency}}</p>
            </div>
            <span>
                <p-button
                    outlined="true"
                    severity="danger"
                    (click)="removeItemFromCart()"
                    icon="pi pi-trash"                    
                    > </p-button>
            </span>
        </div>

        <div class="w-full flex-1 space-y-4 order-2 max-w-md">
            <a routerLink="/features/shop/{{item().productId}}" class="shrink order-1">
                <img src="{{item().pictureUrl}}" alt="product image" class="w-48 shrink-0 mx-auto md:mx-0" alt="shopping-cart-2-1" />
            </a>
        </div>
    </div>
</div>
