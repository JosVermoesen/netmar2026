@if (product) {
<div class="p-2">
    <div routerLink="/features/shop/{{product.id}}" class="shadow-sm p-6 bg-surface-0 dark:bg-surface-900 rounded-lg">
        <div class="relative mb-4">
            <span class="bg-surface-0 dark:bg-surface-900 text-surface-900 dark:text-surface-0 shadow-xs px-4 py-2 absolute rounded-3xl" style="left: 1rem; top: 1rem">{{product.type}} {{product.brand}}</span>
            <img [src]="product.pictureUrl" class="w-full" />
            <div (click)="$event.stopPropagation()">
                <button
                    type="button"
                    pRipple
                    (click)="cartService.addItemToCart(product)"
                    class="border border-white! rounded py-2 px-4 absolute! bg-black/30! text-white! inline-flex items-center justify-center hover:bg-black/40 transition-colors duration-300 cursor-pointer"
                    style="bottom: 1rem; left: 1rem; width: calc(100% - 2rem)"
                >
                    <i class="pi pi-shopping-cart mr-4 text-base"></i>
                    <span class="text-base">Add to Cart</span>
                </button>
            </div>
        </div>
        <div class="flex justify-between items-center mb-4">
            <span class="text-surface-900 dark:text-surface-0 font-medium text-xl">{{product.name}}</span>
            <span class="text-primary text-xl font-medium">{{product.price | currency: "EUR"}}</span>
        </div>
    </div>
</div>

}
