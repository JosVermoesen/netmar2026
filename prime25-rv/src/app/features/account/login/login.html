<p-dialog [(visible)]="showLogInDialog" [closable]="false" [style]="{ width: '450px' }" header="Login" [modal]="true">
    <ng-template #content>
        <form [formGroup]="loginForm">
            <div class="flex flex-col gap-6">
                <div>
                    <label for="email" class="block font-bold mb-4">Email</label>
                    <input formControlName="email" type="email" pInputText id="email" required autofocus fluid />
                </div>
                <div>
                    <label for="password" class="block font-bold mb-4">Password</label>
                    <p-password class="block" formControlName="password" [toggleMask]="true" />
                </div>
            </div>
        </form>
    </ng-template>

    <ng-template pTemplate="footer">
        <p-button label="Cancel" icon="pi pi-times" text (click)="onCancel()" />
        <p-button [disabled]="loginForm.invalid" label="Login" icon="pi pi-check" (click)="onSubmit()" />
    </ng-template>
</p-dialog>
